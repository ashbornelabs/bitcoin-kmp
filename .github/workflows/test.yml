name: Check

# Patterns are evaluated in order: a later pattern overrides an earlier one, which re-includes the workflows that run the checks.
on:
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!**.adoc'
      - '!**/.gitignore'
      - '!.github/**'
      - '.github/workflows/test.yml'
      - '.github/workflows/build.yml'
  push:
    branches-ignore:
      - 'master'
      - 'snapshot/*'
    paths:
      - '**'
      - '!**.md'
      - '!**.adoc'
      - '!**/.gitignore'
      - '!.github/**'
      - '.github/workflows/test.yml'
      - '.github/workflows/build.yml'

jobs:
  check:
    name: Check
    uses: ./.github/workflows/build.yml
